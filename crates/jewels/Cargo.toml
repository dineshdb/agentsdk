[package]
name = "jewels"
version = "0.1.0"
edition = "2024"
authors = ["Dinesh Bhattarai <dinesh.bhattarai@gmail.com>"]
description = "A simple secret scanner and redactor utility"
license = "MIT"
repository = "https://github.com/dineshdb/agentsdk"
readme = "README.md"
keywords = ["security", "secrets", "scanner", "redact"]
categories = ["development-tools"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# CLI specific dependencies
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:anyhow"]

[[bin]]
name = "jewels"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bench]]
name = "redact_bench"
harness = false
