[package]
name = "agentsdk-plugin-mcp"
version = "0.2.0"
edition.workspace = true
license.workspace = true
homepage = "https://github.com/dineshdb/agentsdk/tree/main/crates/agentsdk-plugin-mcp"
repository = "https://github.com/dineshdb/agentsdk"
description = "An MCP (Model Context Protocol) plugin for agentsdk."
keywords = ["mcp", "ai", "agents", "llm"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
agentsdk = { workspace = true }
agentsdk-plugin-skills = { workspace = true }
async-trait = { workspace = true }
http = "1.0"
reqwest = { workspace = true }
# Minor pinned on purpose (QS-102): the negotiate() fallback below speaks the
# legacy initialize-handshake era, and rmcp 3.5.0 (2026-09-28) moved
# ProtocolVersion::LATEST to the discover-only V_2026_07_28 — a routine
# `cargo update` must not shift the ground under that fallback. Un-pin only as
# a deliberate protocol-era decision.
rmcp = { version = ">=3.4, <3.5", features = ["client", "transport-child-process", "schemars", "reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "auth"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
dotenv = { workspace = true }
tracing-subscriber = { workspace = true }
