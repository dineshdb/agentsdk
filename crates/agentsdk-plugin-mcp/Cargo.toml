[package]
name = "agentsdk-plugin-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage = "https://github.com/dineshdb/agentsdk/tree/main/crates/agentsdk-plugin-mcp"
repository = "https://github.com/dineshdb/agentsdk"
description = "An MCP (Model Context Protocol) plugin for agentsdk."
keywords = ["mcp", "ai", "agents", "llm"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
agentsdk = { workspace = true }
async-trait = { workspace = true }
http = "1.0"
rmcp = { version = "1.7.0", features = ["client", "transport-child-process", "schemars", "client-side-sse", "reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
dotenv = { workspace = true }
